<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramen Order</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff9ecf, #ffcce6);
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.container {
  background: white;
  padding: 20px;
  border-radius: 15px;
  width: 300px;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}
button {
  background: #ff4da6;
  color: white;
  border: none;
  padding: 10px;
  border-radius: 10px;
  cursor: pointer;
  margin-top: 10px;
}
.hidden { display: none; }
</style>
</head>
<body>

<div class="container" id="page1">
  <h2>Data Pelanggan</h2>
  <input type="text" id="nama" placeholder="Nama"><br><br>
  <input type="number" id="saldo" placeholder="Saldo"><br>
  <button onclick="nextPage1()">Lanjut</button>
</div>

<div class="container hidden" id="page2">
  <h2>Pilih Menu</h2>
  <select id="menu">
    <option value="25000">Small - 25.000</option>
    <option value="40000">Medium - 40.000</option>
    <option value="60000">Large - 60.000</option>
  </select><br><br>
  <label><input type="checkbox" id="topping"> Extra Topping (+10.000)</label><br>
  <button onclick="nextPage2()">Bayar</button>
</div>

<div class="container hidden" id="page3">
  <h2>Pembayaran</h2>
  <p id="total"></p>
  <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=PembayaranRamen" alt="QR Code">
</div>

<script>
let totalBayar = 0;

function nextPage1() {
  let saldo = document.getElementById("saldo").value;
  if (saldo < 100000) {
    alert("Saldo tidak cukup!");
    return;
  }
  document.getElementById("page1").classList.add("hidden");
  document.getElementById("page2").classList.remove("hidden");
}

function nextPage2() {
  let menu = parseInt(document.getElementById("menu").value);
  let topping = document.getElementById("topping").checked ? 10000 : 0;
  totalBayar = menu + topping;

  document.getElementById("total").innerText = "Total: Rp " + totalBayar;

  document.getElementById("page2").classList.add("hidden");
  document.getElementById("page3").classList.remove("hidden");
}
</script>

</body>
</html>
